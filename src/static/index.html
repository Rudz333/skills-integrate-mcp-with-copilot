<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Mergington High School</h1>
        <h2>Extracurricular Activities</h2>
      </div>
      <button id="login-button" type="button">Teacher Login</button>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Teacher Registration Desk</h3>
        <p id="access-message">Teachers must log in to register or unregister students.</p>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Register Student</button>
        </form>
        <button id="logout-button" class="secondary-button hidden" type="button">Log Out</button>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <div id="login-dialog" class="login-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher Login</h3>
        <label for="username">Username:</label>
        <input id="username" name="username" required autocomplete="username" />
        <label for="password">Password:</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
        <div class="dialog-actions">
          <button id="cancel-login" class="secondary-button" type="button">Cancel</button>
          <button type="submit">Log In</button>
        </div>
      </form>
    </div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
